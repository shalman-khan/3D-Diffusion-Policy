name: real_cable_pull

task_name: RealCablePull

shape_meta: &shape_meta
  obs:
    point_cloud:
      # n_points is set at the top level of dp3.yaml and overridable on the CLI.
      # OmegaConf resolves ${n_points} from the root of the composed config.
      shape:
        - ${n_points}
        - 6
      type: point_cloud
    agent_pos:
      # robot1_joints(6) + gripper1(1) + robot2_joints(6) + gripper2(1) = 14
      shape: [14]
      type: low_dim
  action:
    # joint deltas: robot1(6) + gripper1(1) + robot2(6) + gripper2(1) = 14
    shape: [14]

dataset:
  _target_: diffusion_policy_3d.dataset.robosuite_dataset.RobosuiteDataset
  zarr_path: /home/rosi/3D-Diffusion-Policy/3D-Diffusion-Policy/data/real_cable_pull_28may.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  n_points: ${n_points}   # passed to RobosuiteDataset for on-the-fly FPS downsampling

# No sim rollouts for real robot — evaluation is done via policy_executor.py
env_runner:
  _target_: diffusion_policy_3d.env_runner.real_robot_runner.RealRobotRunner

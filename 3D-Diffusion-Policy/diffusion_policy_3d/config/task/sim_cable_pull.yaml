name: sim_cable_pull

task_name: TwoArmPullApart

# Mirrors real_two_arm_lift.yaml exactly (14-dim state/action, 6-ch XYZRGB cloud)
# so the simulation pipeline trains identically to the real-robot pipeline.
shape_meta: &shape_meta
  obs:
    point_cloud:
      shape: [1024, 6]      # XYZRGB — must match collect_two_arm_pull_apart_data.py
      type: point_cloud
    agent_pos:
      # robot0_joints(6) + grip0(1) + robot1_joints(6) + grip1(1) = 14
      shape: [14]
      type: low_dim
  action:
    # joint deltas (np.diff(state)): r0_delta(6) + g0(1) + r1_delta(6) + g1(1) = 14
    shape: [14]

dataset:
  _target_: diffusion_policy_3d.dataset.robosuite_dataset.RobosuiteDataset
  zarr_path: /home/rosi/3D-Diffusion-Policy/3D-Diffusion-Policy/data/sim_cable_pull.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null

# In-sim closed-loop evaluation — the analogue of real_robot/policy_executor.py.
# Reproduces the delta -> accumulate -> command loop inside MuJoCo at 20 Hz.
env_runner:
  _target_: diffusion_policy_3d.env_runner.sim_cable_pull_runner.SimCablePullRunner
  n_train: 20
  max_steps: 600
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 20
  task_name: TwoArmPullApart
